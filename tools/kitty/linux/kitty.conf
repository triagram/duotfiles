# ==============================================================================
# Kitty Configuration File
# Themes: Catppuccin-Mocha (Dark Mode) & Catppuccin-Frappe (Light Mode)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 字體配置 (Fonts)
# ------------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# 標點符號與連字 (Ligatures) 設置
disable_ligatures cursor

# ------------------------------------------------------------------------------
# 2. 界面美化與窗口設置 (Window Aesthetics & Padding)
# ------------------------------------------------------------------------------
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# 背景透明度與模糊效果 (需窗口管理器支持)
background_opacity 0.95
background_blur    1

# ------------------------------------------------------------------------------
# 3. 標籤頁欄樣式與自動命名 (Tab Bar & Titles)
# ------------------------------------------------------------------------------
tab_bar_edge        bottom
tab_bar_style       fade
tab_bar_margin_width 4.0
active_tab_font_style   bold
inactive_tab_font_style normal

# Tab 自動命名模板 (例：tab1: zsh, tab2: nvim)
tab_title_template "tab{index}: {title}"

# ------------------------------------------------------------------------------
# 4. 視窗分屏與布局 (Splits & Layouts)
# ------------------------------------------------------------------------------
enabled_layouts     splits, stack, tall, grid
window_border_width 1.0pt
draw_minimal_borders yes

# ------------------------------------------------------------------------------
# 5. 光標與滾動條 (Cursor & Scrollback)
# ------------------------------------------------------------------------------
cursor_shape         beam
cursor_blink_interval 0.5
scrollback_lines     10000

# ------------------------------------------------------------------------------
# 6. 快捷鍵設定 (Keybindings)
# ------------------------------------------------------------------------------
# 分屏快捷鍵 (在當前工作目錄下新建分屏)
map ctrl+shift+| launch --location=vline --cwd=current
map ctrl+shift+- launch --location=hline --cwd=current

# 使用 Alt + 方向鍵在分屏視窗間快速切換焦點
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# 使用 Alt + 數字鍵快速切換 Tab (1 ~ 9)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# 標籤頁管理與手動重命名
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+r set_tab_title

# ------------------------------------------------------------------------------
# 7. Shell 集成與遠程控制 (Shell Integration & Control)
# ------------------------------------------------------------------------------
shell_integration enabled
allow_remote_control yes


# ------------------------------------------------------------------------------
# 8. 視窗初始大小 (Initial Window Size)
# ------------------------------------------------------------------------------
# 單位：加 c 後綴為「字元格」，不加則為「像素」。
# 注意：remember_window_size 預設為 yes，會覆蓋下面兩行使其完全失效，
#       因此必須顯式設為 no。代價是每個新視窗都固定此大小，不再沿用上次拖拽的尺寸。
remember_window_size  no
initial_window_width  80c
initial_window_height 24c

# ------------------------------------------------------------------------------
# 9. 游標拖尾 (Cursor Trail)
# ------------------------------------------------------------------------------
# cursor_trail 的值 = 游標「靜止超過多少毫秒」後的跳轉才畫拖尾。
# 值越大拖尾越少 —— 這裡取較大值是為了濾掉 TUI（如 Claude Code）頻繁重繪
# 造成的滿屏拖尾，只保留「停頓後的大跳轉」。嫌太少往 20 調，嫌太多往 50 調。
cursor_trail                 20
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# ------------------------------------------------------------------------------
# 11. 背景圖開關 (Background Image Toggle)
# ------------------------------------------------------------------------------
# 背景圖本身的設定在 theme-overrides.conf，並由四個主題檔 include 進去 ——
# 因為 *-theme.auto.conf 會覆蓋 background_* 系列設定，寫在本檔不生效。
#
# listen_on 是 toggle 腳本的前提：沒有它，KITTY_LISTEN_ON 不會被設定，
# 背景行程裡的 kitty @ 會回退去找 /dev/tty 而失敗。kitty 會自動在名稱後附加 PID。
listen_on unix:@kitty

# Ctrl+中鍵     開↔關       （與內建的 20 條 mouse_map 無衝突，中鍵貼上不受影響）
# Ctrl+Shift+中鍵 換下一張圖
mouse_map ctrl+middle       release ungrabbed launch --type=background --allow-remote-control ~/.config/kitty/toggle-bg.sh toggle
mouse_map ctrl+shift+middle release ungrabbed launch --type=background --allow-remote-control ~/.config/kitty/toggle-bg.sh next

# ------------------------------------------------------------------------------
# 10. 主題配置 (Catppuccin-Mocha / Catppuccin-Frappe)
# ------------------------------------------------------------------------------
# BEGIN_KITTY_THEME
# Catppuccin-Mocha (Dark Mode) / Catppuccin-Frappe (Light Mode)
include current-theme.conf
# END_KITTY_THEME

