# ==============================================================================
# 背景圖設定
# ==============================================================================
# 為何獨立成檔：啟用了 *-theme.auto.conf 自動深淺色主題後，kitty 會用主題檔
# 覆蓋 background_image / background_image_layout / background_tint 這幾項，
# 寫在 kitty.conf 裡不會生效。因此這裡獨立成檔，由每個主題檔 include 進去。
#
# 注意：重跑 theme kitten 換配色時，*.auto.conf 會被重新產生，
#       屆時需要把 `include background.conf` 這行加回去（見 kitty.conf 第 11 節）。

background_image        backgrounds/hduhlpie.png
# cscaled = 縮放到視窗大小並保持長寬比。
# 其他可選：scaled（拉伸填滿，會變形）／centered／tiled／mirror-tiled／clamped
background_image_layout cscaled
# 0 = 圖片原樣（文字難讀），1 = 完全被背景色蓋住。往下調圖更清楚，往上調字更清楚。
background_tint         0.85
background_tint_gaps    1.0

# ==============================================================================
# 標籤欄顏色
# ==============================================================================
# 和背景圖同理：這幾項在 current-theme.conf / *-theme.auto.conf 裡都有定義，
# 直接改主題檔會被自動深淺色切換覆蓋掉，所以集中放這裡。
# 取色自 Catppuccin Mocha 的中性灰階（Surface / Overlay 系列），與配色一致。
active_tab_foreground   #CDD6F4
active_tab_background   #585B70
inactive_tab_foreground #7F849C
inactive_tab_background #181825
tab_bar_background      #11111B
