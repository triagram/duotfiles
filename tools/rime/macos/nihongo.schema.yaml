# Rime schema
# encoding: utf-8

schema:
  schema_id: nihongo
  name: "日"
  version: "1.1"
  author: "antigravity"
  description: |
    日語羅馬字假名輸入方案。
    現況：僅支援假名（平假名 + 片假名），無漢字變換。
    片假名由 lua/katakana_filter.lua 以碼位偏移動態生成，詞典中不含片假名條目。
    漢字變換的升級路線見 DESIGN.md §7.3。

switches:
  - name: ascii_mode
    reset: 0
    states: [ かな, Ａ ]
  - name: katakana          # 控制平/片假名誰排第一候選，兩者始終都可選
    reset: 0
    states: [ ひら, カタ ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - lua_filter@*katakana_filter
    - uniquifier

speller:
  # 「-」用於長音符 ー（見 nihongo.dict.yaml 末行），必須留在字母表內，
  # 因此不可將其挪作標點使用。
  alphabet: zyxwvutsrqponmlkjihgfedcba-
  delimiter: " '"

translator:
  dictionary: nihongo
  enable_user_dict: false

# 日文標點。不使用 import_preset: default —— 那會套用中文標點（。，），語種不符。
punctuator:
  half_shape:
    ',' : '、'
    '.' : '。'
    '[' : '「'
    ']' : '」'
    '{' : '『'
    '}' : '』'
    '/' : '・'
    '?' : '？'
    '!' : '！'
    ':' : '：'
    ';' : '；'
    '~' : '〜'
    '(' : '（'
    ')' : '）'
    '"' : '”'
    '<' : '＜'
    '>' : '＞'

key_binder:
  import_preset: default
